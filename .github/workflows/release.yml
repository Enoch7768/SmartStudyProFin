name: Build SmartStudyPro release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, fileinfo, openssl, curl, zip, gd, mbstring, simplexml
          coverage: none
      - name: Validate release version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG"
      - name: Run release validation
        run: |
          find app admin bootstrap database scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/release-package.php
          php tests/config-secrets.php
          php tests/contact.php
          php tests/unit.php
          php tests/run.php
          php tests/assistant.php
          php tests/recognition.php
          php tests/operations.php
          php tests/content-security.php
          php tests/performance.php
          php tests/security.php
          php tests/site-smoke.php
          node --check assets/js/main.js
          node tests/main-js.test.cjs
      - name: Build clean deployment package
        run: |
          mkdir -p dist/package
          git archive "$GITHUB_SHA" | tar --exclude='composer.phar' --exclude='cms' --exclude='db' --exclude='tests' --exclude='.github' --exclude='transcripts' --exclude='uploads/avatars/*' --exclude='database/bookings.db' --exclude='database/bookings.sqlite' --exclude='Income Statement and distribution.xlsx' --exclude='Readme.txt' -x -C dist/package
          git archive "$GITHUB_SHA" uploads/avatars/.htaccess | tar -x -C dist/package
          mkdir -p dist/package/uploads/avatars
          touch dist/package/uploads/avatars/.gitkeep
          VERSION="${GITHUB_REF_NAME}"
          cd dist/package
          zip -qr "../smartstudypro-${VERSION}.zip" .
          cd ..
          unzip -Z1 "smartstudypro-${VERSION}.zip" > "smartstudypro-${VERSION}.files.txt"
          grep -Fx 'assets/vendor/bootstrap/css/bootstrap.min.css' "smartstudypro-${VERSION}.files.txt"
          grep -Fx 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' "smartstudypro-${VERSION}.files.txt"
          ! grep -Eq '(^|/)vendor/autoload.php$|(^|/)node_modules/' "smartstudypro-${VERSION}.files.txt"
          sha256sum "smartstudypro-${VERSION}.zip" > "smartstudypro-${VERSION}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/smartstudypro-${GITHUB_REF_NAME}.zip
            dist/smartstudypro-${GITHUB_REF_NAME}.zip.sha256
