name: Build SmartStudyPro release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, fileinfo, openssl
          coverage: none
      - name: Validate release version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG"
      - name: Run release validation
        run: |
          find app admin bootstrap database install scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/unit.php
          php tests/run.php
          php tests/assistant.php
          php tests/recognition.php
          php tests/operations.php
      - name: Build clean deployment package
        run: |
          mkdir -p dist/package
          git archive "$GITHUB_SHA" | tar -x -C dist/package
          rm -rf dist/package/.github dist/package/tests dist/package/cms dist/package/db dist/package/transcripts
          find dist/package/database -maxdepth 1 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -delete
          if [ -d dist/package/uploads/avatars ]; then find dist/package/uploads/avatars -type f -delete; fi
          mkdir -p dist/package/uploads/avatars
          touch dist/package/uploads/avatars/.gitkeep
          if [ -d dist/package/storage ]; then find dist/package/storage -mindepth 1 -maxdepth 1 ! -name '.htaccess' ! -name 'index.html' -exec rm -rf {} +; fi
          rm -f dist/package/.env dist/package/config/local.php "dist/package/Income Statement and distribution.xlsx" dist/package/Readme.txt
          VERSION="${GITHUB_REF_NAME}"
          cd dist/package
          zip -qr "../smartstudypro-${VERSION}.zip" .
          cd ..
          sha256sum "smartstudypro-${VERSION}.zip" > "smartstudypro-${VERSION}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/smartstudypro-${GITHUB_REF_NAME}.zip
            dist/smartstudypro-${GITHUB_REF_NAME}.zip.sha256
