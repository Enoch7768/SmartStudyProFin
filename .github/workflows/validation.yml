name: SmartStudyPro validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, fileinfo, openssl, curl, zip, gd, mbstring, simplexml, mongodb
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PHP syntax
        run: find app admin bootstrap database install scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate dependency installer
        run: php tests/dependency-installer.php
      - name: Validate release package
        run: php tests/release-package.php
      - name: Run application tests
        run: |
          php tests/unit.php
          php tests/run.php
          php tests/assistant.php
          php tests/recognition.php
          php tests/operations.php
          php tests/content-security.php
          php tests/performance.php
          php tests/security.php
          php tests/site-smoke.php
          node --check assets/js/main.js
          node tests/main-js.test.cjs
