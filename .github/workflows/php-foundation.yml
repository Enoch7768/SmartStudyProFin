name: PHP foundation checks

on:
  push:
    branches:
      - main
      - phase-1-secure-foundation
      - phase-2-cms-theme-favicon
      - phase-2-native-php-cms
      - phase-3-identity-student-portal
      - phase-4-learning-engine
      - phase-5-commerce-payments
      - phase-6-ai-learning-assistant
      - phase-7-recognition-analytics
      - phase-8-release-operations
      - phase-9-production-hardening
  pull_request:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, fileinfo, openssl, curl, zip, gd, mbstring, simplexml
          coverage: none
      - name: Lint foundation PHP
        run: find . -path './.git' -prune -o -path './cms' -prune -o -path './assets' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate deployment package and dependency policy
        run: php tests/release-package.php
      - name: Lint migrated public pages
        run: php -l login.php && php -l legal-consent.php && php -l register.php && php -l logout.php && php -l reset.php && php -l profile.php && php -l admin.php && php -l google-auth.php && php -l learning.php && php -l study.php && php -l lesson-media.php && php -l cart.php && php -l cart-add.php && php -l checkout.php && php -l process_payment.php && php -l dpo-webhook.php && php -l payment-start.php && php -l payment-return.php && php -l payment-webhook.php && php -l receipt.php && php -l view.php && php -l payment-choice.php && php -l payment-demo.php && php -l admin/payment-demo-settings.php && php -l orders.php && php -l admin/orders.php && php -l admin/refunds.php && php -l admin/product-assets.php && php -l stream.php && php -l grade-quiz.php && php -l download.php && php -l index.php && php -l legal.php && php -l privacy.php && php -l terms.php && php -l eula.php && php -l cookies.php && php -l accessibility.php && php -l refunds.php && php -l courses.php && php -l course-details.php && php -l about.php && php -l products.php && php -l product-details.php && php -l contact.php && php -l booking.php && php -l notifications.php && php -l meetings.php && php -l admin/meetings.php && php -l achievements.php && php -l certificates.php && php -l verify-certificate.php && php -l admin/analytics.php && php -l admin/backups.php && php -l admin/diagnostics.php && php -l admin/updates.php
      - name: Test private configuration secrets
        run: php tests/config-secrets.php
      - name: Test contact inbox and abuse controls
        run: php tests/contact.php
      - name: Test security and routing
        run: php tests/unit.php
      - name: Lint media endpoints
        run: php -l media.php && php -l favicon.php && php -l admin/media-preview.php
      - name: Test SQLite migrations, identity and CMS
        run: php tests/run.php
      - name: Test commerce delivery and refund ledger
        run: php tests/commerce-phase5.php
      - name: Test simulated payment mode
        run: php tests/demo-payments.php
      - name: Test course delivery modes and meeting planner
        run: php tests/meetings.php
      - name: Test instructor workspace permissions
        run: php tests/instructor-workspace.php
      - name: Test AI assistant retrieval and privacy
        run: php tests/assistant.php
      - name: Test notifications, achievements and certificates
        run: php tests/recognition.php
      - name: Test backups and release operations
        run: php tests/operations.php
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate browser JavaScript
        run: node --check assets/js/main.js && node tests/main-js.test.cjs && node --check assets/js/cms-theme.js && node tests/cms-theme.test.cjs && node --check assets/js/media-library.js && node tests/media-library.test.cjs
      - name: Test CMS rich-text sanitization
        run: php tests/content-security.php
      - name: Validate production SQLite query plans
        run: php tests/performance.php
      - name: Test production security configuration
        run: php tests/security.php
      - name: Smoke-test every application page and local asset
        run: php tests/site-smoke.php
      - name: Validate release workflow and package contents
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/release.yml')"
          mkdir -p /tmp/smartstudypro-release-check
          git archive HEAD | tar --exclude='composer.phar' --exclude='cms' --exclude='db' --exclude='tests' --exclude='.github' --exclude='transcripts' --exclude='uploads/avatars/*' --exclude='database/bookings.db' --exclude='database/bookings.sqlite' --exclude='Income Statement and distribution.xlsx' --exclude='Readme.txt' -x -C /tmp/smartstudypro-release-check
          git archive HEAD uploads/avatars/.htaccess | tar -x -C /tmp/smartstudypro-release-check
          mkdir -p /tmp/smartstudypro-release-check/uploads/avatars
          touch /tmp/smartstudypro-release-check/uploads/avatars/.gitkeep
          test -f /tmp/smartstudypro-release-check/VERSION
          test -f /tmp/smartstudypro-release-check/favicon.php
          test -f /tmp/smartstudypro-release-check/assets/vendor/bootstrap/css/bootstrap.min.css
          test -f /tmp/smartstudypro-release-check/assets/vendor/bootstrap/js/bootstrap.bundle.min.js
          test -f /tmp/smartstudypro-release-check/assets/css/device-responsive.css
          test -f /tmp/smartstudypro-release-check/assets/js/main.js
          test ! -e /tmp/smartstudypro-release-check/vendor
          test ! -e /tmp/smartstudypro-release-check/node_modules
          test ! -e /tmp/smartstudypro-release-check/install
          test -f /tmp/smartstudypro-release-check/database/migrations/008_notifications_recognition_analytics.php
          test -f /tmp/smartstudypro-release-check/database/migrations/009_production_indexes.php
          test -f /tmp/smartstudypro-release-check/database/migrations/010_legal_acceptance.php
          test -f /tmp/smartstudypro-release-check/database/migrations/011_demo_payments.php
          test -f /tmp/smartstudypro-release-check/database/migrations/012_commerce_delivery_refunds.php
          test -f /tmp/smartstudypro-release-check/database/migrations/013_meeting_planner.php
          test -f /tmp/smartstudypro-release-check/database/migrations/014_meeting_reminders.php
          test -f /tmp/smartstudypro-release-check/PRIVACY_POLICY.md
          test -f /tmp/smartstudypro-release-check/EULA.md
          test ! -e /tmp/smartstudypro-release-check/cms
          test ! -e /tmp/smartstudypro-release-check/db
          test ! -e /tmp/smartstudypro-release-check/database/bookings.db
          test ! -e /tmp/smartstudypro-release-check/tests
          test -f /tmp/smartstudypro-release-check/uploads/avatars/.gitkeep
          test -f /tmp/smartstudypro-release-check/uploads/avatars/.htaccess
