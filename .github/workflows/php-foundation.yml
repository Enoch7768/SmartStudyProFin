name: PHP foundation checks

on:
  push:
    branches:
      - main
      - phase-1-secure-foundation
      - phase-2-native-php-cms
      - phase-3-identity-student-portal
      - phase-4-learning-engine
      - phase-5-commerce-payments
      - phase-6-ai-learning-assistant
  pull_request:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, fileinfo, openssl
          coverage: none
      - name: Lint foundation PHP
        run: find app admin bootstrap database install scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint migrated public pages
        run: php -l login.php && php -l register.php && php -l logout.php && php -l reset.php && php -l profile.php && php -l admin.php && php -l google-auth.php && php -l learning.php && php -l study.php && php -l lesson-media.php && php -l cart.php && php -l checkout.php && php -l process_payment.php && php -l dpo-webhook.php && php -l payment-start.php && php -l payment-return.php && php -l payment-webhook.php && php -l payment-choice.php && php -l orders.php && php -l admin/orders.php && php -l stream.php && php -l grade-quiz.php && php -l download.php && php -l index.php && php -l courses.php && php -l course-details.php && php -l about.php && php -l products.php && php -l product-details.php && php -l contact.php && php -l booking.php
      - name: Test security and routing
        run: php tests/unit.php
      - name: Lint media endpoint
        run: php -l media.php
      - name: Test SQLite migrations, identity and CMS
        run: php tests/run.php
      - name: Test AI assistant retrieval and privacy
        run: php tests/assistant.php
