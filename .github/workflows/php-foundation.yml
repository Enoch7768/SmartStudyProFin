name: PHP foundation checks

on:
  push:
    branches:
      - main
      - phase-1-secure-foundation
      - phase-2-native-php-cms
  pull_request:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, fileinfo, openssl
          coverage: none
      - name: Lint foundation PHP
        run: find app admin bootstrap database install scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint migrated public pages\n        run: php -l index.php && php -l courses.php && php -l course-details.php && php -l about.php && php -l products.php && php -l product-details.php && php -l contact.php && php -l booking.php\n      - name: Test security and routing
        run: php tests/unit.php
      - name: Lint media endpoint
        run: php -l media.php
      - name: Test SQLite migrations, identity and CMS
        run: php tests/run.php
